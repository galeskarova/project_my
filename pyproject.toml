[tool.poetry]
name = "project-my"
version = "0.1.0"
description = ""
authors = ["Nastya <galeskarova@list.ru>"]
readme = "README.md"
requires-python = ">=3.9"

[tool.poetry.dependencies]
python = "^3.9"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = "^7.1"
black = "^26.3"
isort = "^8.0"
mypy = "^1.19"
flake8 = "^7.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py
)
'''

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = ["venv"]

[mypy]
python_version = 3.8
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
explicit_package_bases = true
namespace_packages = true

mypy_path = src

[mypy-pytest.*]
ignore_missing_imports = true

[mypy-decorators]
ignore_missing_imports = false